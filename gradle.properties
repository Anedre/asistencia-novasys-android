org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend the app talks to. Override per machine in ~/.gradle/gradle.properties
# or on the command line (-PnovaApiBaseUrlDebug=http://192.168.1.20:3000).
# 10.0.2.2 is the host machine as seen from the Android emulator.
novaApiBaseUrlDebug=http://10.0.2.2:3000
novaApiBaseUrl=https://asistencia.novasys.com.pe

# Cognito public app client (USER_PASSWORD_AUTH, no secret) — the same pool
# and client the web app signs in with.
novaCognitoRegion=us-east-1
novaCognitoClientId=7d058e5kinhnsvo42qrfbogfte

# GitHub repository whose Releases the app checks for self-updates.
novaUpdateRepo=Anedre/asistencia-novasys-android
