# Publishes a signed APK as a GitHub Release whenever a version tag is pushed.
# Installed apps poll the latest Release and offer the update in-app.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Needs four repository secrets, created once by scripts/setup-release-signing.ps1:
# NOVA_KEYSTORE_BASE64, NOVA_KEYSTORE_PASSWORD, NOVA_KEY_ALIAS, NOVA_KEY_PASSWORD.
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
      NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
      NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
      NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        # An unsigned APK can't update an installed app, so fail loudly instead
        # of publishing one.
        run: |
          for s in NOVA_KEYSTORE_BASE64 NOVA_KEYSTORE_PASSWORD NOVA_KEY_ALIAS NOVA_KEY_PASSWORD; do
            if [ -z "${!s}" ]; then
              echo "::error::Falta el secret $s. Corre scripts/setup-release-signing.ps1."
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        run: echo "$NOVA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          NOVA_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # versionCode must only ever grow; the workflow run number does.
          ./gradlew assembleRelease \
            -PnovaVersionName="$VERSION" \
            -PnovaVersionCode="$GITHUB_RUN_NUMBER"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="nova-asistencia-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Nova Asistencia $VERSION" \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
